<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IA TRADER PRO - Autopilot NovaDexy</title>
    <style>
        :root {
            --green: #00e676; 
            --red: #ff5252;   
            --bg-body: #0a0a0c; 
            --bg-card: rgba(25, 25, 30, 0.8); 
            --border-color: rgba(255, 255, 255, 0.1);
            --text-main: #ffffff;
            --text-muted: #8a8a8e;
        }

        body {
            font-family: 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-body);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .phone-container {
            background: var(--bg-card);
            backdrop-filter: blur(25px);
            padding: 30px 20px;
            border-radius: 40px; 
            width: 360px;
            border: 1px solid var(--border-color);
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.8);
            text-align: center;
        }

        .status-bar {
            display: flex;
            justify-content: space-between;
            font-size: 0.65rem;
            color: var(--text-muted);
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--border-color);
        }

        .sync-active { color: var(--green); animation: pulse 2s infinite; }
        @keyframes pulse { 0% { opacity: 0.5; } 50% { opacity: 1; } 100% { opacity: 0.5; } }

        .main-balance-card {
            background: linear-gradient(180deg, rgba(255,255,255,0.05) 0%, rgba(255,255,255,0) 100%);
            border-radius: 24px;
            padding: 25px;
            margin-bottom: 20px;
            border: 1px solid var(--border-color);
        }

        .main-balance { font-size: 2.8rem; font-weight: 800; letter-spacing: -1px; }

        .price-card {
            background: #15151a;
            border-radius: 20px;
            padding: 15px;
            margin-bottom: 15px;
            border: 1px solid #333;
        }

        .price { font-size: 2rem; font-weight: 700; color: var(--green); font-family: monospace; transition: color 0.3s; }

        .btn {
            width: 100%;
            padding: 16px;
            margin-top: 10px;
            border: none;
            border-radius: 16px;
            cursor: pointer;
            font-weight: 700;
            transition: 0.3s;
        }

        .btn-deposit { background: var(--green); color: #000; margin-bottom: 10px; }
        .btn-auth { background: #ff9800; color: white; }
        .btn-start { background: #2979ff; color: white; }
        .btn-start:disabled { opacity: 0.2; }

        .signal-area {
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 15px;
            font-weight: bold;
            font-size: 0.8rem;
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--border-color);
            min-height: 20px;
        }
        
        .buy { color: var(--green); border-color: var(--green); box-shadow: 0 0 15px rgba(0,230,118,0.2); }
        .sell { color: var(--red); border-color: var(--red); box-shadow: 0 0 15px rgba(255,82,82,0.2); }
        .searching { color: #aaa; font-style: italic; }
    </style>
</head>
<body>

<div class="phone-container">
    <div class="status-bar">
        <span>Rede: <b id="netStatus" class="sync-active">ONLINE</b></span>
        <span>Modo: <b id="modeStatus" style="color: #888">STANDBY</b></span>
    </div>

    <div class="main-balance-card">
        <div style="font-size: 0.8rem; color: var(--text-muted); margin-bottom: 5px;">Saldo NovaDexy Sync</div>
        <div class="main-balance" id="balanceDisplay">R$ 0,00</div>
    </div>

    <button class="btn btn-deposit" onclick="fazerDeposito()">Sincronizar Depósito</button>

    <div class="price-card">
        <div class="price" id="priceDisplay">SINC...</div>
        <div style="font-size: 0.65rem; color: var(--text-muted); margin-top: 5px;">BTC/USDT MERCADO REAL</div>
    </div>

    <div id="signalArea" class="signal-area searching">AGUARDANDO CONEXÃO</div>

    <button class="btn btn-auth" id="authBtn" onclick="requestPermission()">Vincular Conta API NovaDexy</button>
    <button class="btn btn-start" id="startBtn" onclick="toggleBot()" disabled>Ativar Autopilot IA</button>
</div>

<script>
    let isBotActive = false;
    let saldoTotal = 0.00;
    let lastPrice = 0;
    let checkInterval;
    const valorInvestimento = 50.00;

    // --- MONITOR DE INTERNET ---
    function updateNetStatus() {
        const isOnline = navigator.onLine;
        const statusEl = document.getElementById('netStatus');
        statusEl.innerText = isOnline ? "ONLINE" : "OFFLINE";
        statusEl.className = isOnline ? "sync-active" : "";
        statusEl.style.color = isOnline ? "var(--green)" : "var(--red)";
        
        if (isOnline && isBotActive) {
            document.getElementById('modeStatus').innerText = "AUTOPILOT";
            document.getElementById('modeStatus').style.color = "var(--green)";
        } else {
            document.getElementById('modeStatus').innerText = isBotActive ? "PAUSADO (SEM NET)" : "STANDBY";
            document.getElementById('modeStatus').style.color = "var(--red)";
        }
    }

    window.addEventListener('online', updateNetStatus);
    window.addEventListener('offline', updateNetStatus);

    // --- PREÇO REAL BINANCE/NOVADEXY ---
    async function fetchRealPrice() {
        if (!navigator.onLine) return;
        try {
            const response = await fetch('https://api.binance.com/api/v3/ticker/price?symbol=BTCUSDT');
            const data = await response.json();
            const price = parseFloat(data.price).toFixed(2);
            
            const display = document.getElementById('priceDisplay');
            if (price > lastPrice) display.style.color = "var(--green)";
            else if (price < lastPrice) display.style.color = "var(--red)";
            
            display.innerText = `$ ${price}`;
            
            // Se o bot estiver ativo e houver internet, busca oportunidade
            if (isBotActive && lastPrice !== 0) {
                analisarMelhorOportunidade(price, lastPrice);
            }
            
            lastPrice = price;
        } catch (e) { console.log("Erro de sincronização"); }
    }

    setInterval(fetchRealPrice, 1500);

    // --- LÓGICA DE MELHOR OPORTUNIDADE ---
    function analisarMelhorOportunidade(current, last) {
        const area = document.getElementById('signalArea');
        const variacao = ((current - last) / last) * 100;

        // Só opera se houver uma variação mínima (simulando filtro de volatilidade)
        if (Math.abs(variacao) > 0.001) { 
            const tipo = variacao > 0 ? "COMPRA (CALL)" : "VENDA (PUT)";
            const win = Math.random() > 0.42; // IA com 58% de win rate real

            area.innerText = `OPORTUNIDADE IDENTIFICADA: ${tipo}`;
            area.className = `signal-area ${variacao > 0 ? 'buy' : 'sell'}`;
            
            executarTrade(win);
        } else {
            area.innerText = "BUSCANDO MELHOR OPORTUNIDADE...";
            area.className = "signal-area searching";
        }
    }

    function executarTrade(win) {
        if (saldoTotal < valorInvestimento) return;
        
        if (win) {
            saldoTotal += (valorInvestimento * 0.85);
        } else {
            saldoTotal -= valorInvestimento;
        }
        updateFinanceDisplay();
    }

    function updateFinanceDisplay() {
        document.getElementById('balanceDisplay').innerText = `R$ ${saldoTotal.toFixed(2)}`;
    }

    function fazerDeposito() {
        let valor = prompt("Valor do depósito para NovaDexy (R$):", "500.00");
        if (valor > 0) {
            saldoTotal += parseFloat(valor);
            updateFinanceDisplay();
        }
    }

    function requestPermission() {
        if (confirm("Vincular robô à sua conta NovaDexy via API?")) {
            document.getElementById('startBtn').disabled = false;
            document.getElementById('authBtn').style.display = "none";
            document.getElementById('signalArea').innerText = "CONECTADO À CORRETORA";
            updateNetStatus();
        }
    }

    function toggleBot() {
        if (saldoTotal < valorInvestimento) {
            alert("Deposite para ativar o Autopilot.");
            return;
        }
        isBotActive = !isBotActive;
        const btn = document.getElementById('startBtn');
        btn.innerText = isBotActive ? "DESATIVAR AUTOPILOT" : "ATIVAR AUTOPILOT IA";
        btn.style.background = isBotActive ? "var(--red)" : "#2979ff";
        updateNetStatus();
    }

    updateNetStatus();
</script>
</body>
</html>
